name: CI

on: [push, pull_request]

jobs:
  test:
    name: windows-test
    runs-on: windows-latest
    env:
      NO_COLOR: 1
    steps:
      - uses: actions/checkout@v6
      - name: Fetch dependencies
        run: cargo fetch
      - name: Run tests
        run: cargo test --frozen
  build:
    name: windows-build
    runs-on: windows-latest
    env:
      NO_COLOR: 1
    steps:
      - uses: actions/checkout@v6
      - name: Fetch dependencies
        run: cargo fetch
      - name: Build in release mode
        run: cargo build --release --frozen
      - uses: actions/upload-artifact@v3
        id: artifact-upload-step
        with:
          name: inkjet-windows
          path: .\target\release\inkjet.exe
          retention-days: 3
  linux:
    name: linux
    runs-on: earthly
    env:
      FORCE_COLOR: 1
      EARTHLY_CI: true
    steps:
      - uses: actions/checkout@v6
      - name: Earthly build
        run: earthly --ci +all

  macos:
    name: macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: inkjet build mac
      - uses: actions/upload-artifact@v3
        id: artifact-upload-step
        with:
          name: inkjet-macos
          path: ./output/zips
          retention-days: 3
